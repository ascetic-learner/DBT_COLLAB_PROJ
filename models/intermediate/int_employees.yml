version: 2

models:
  - name: int_employees_merged
    description: "Intermidiate layer to merge Axios and Apsen Employees"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ['employee_id', 'source', 'client_id']
    columns:
      - name: source
        description: Source system code (axi or asp).
        tests:
          - not_null:
              arguments: {}
          - accepted_values:
              arguments:
                values: ['axi', 'asp']
      - name: employee_id
        description: Unique employee identifier within source system.
        tests:
          - not_null:
              arguments: {}
      - name: client_id
        description: Client identifier from lookup table.
        tests:
          - not_null:
              arguments: {}
      - name: hash_key
        description: MD5 hash of employee_id, source, and client_id.
        tests:
          - not_null:
              arguments: {}
          - unique:
              arguments: {}
      - name: hr_client_id
        description: HR client identifier from lookup table.
